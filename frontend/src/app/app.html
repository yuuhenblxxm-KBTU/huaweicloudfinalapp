<div class="container">
  <h1>🔗 URL Shortener</h1>

  <div class="input-row">
    <input [(ngModel)]="inputUrl" placeholder="Paste a long URL here..." />
    <button (click)="shorten()">Shorten</button>
  </div>

  <div class="result" *ngIf="shortenedUrl">
    <span>{{ shortenedUrl }}</span>
    <button (click)="copy()">{{ copied ? 'Copied!' : 'Copy' }}</button>
  </div>

  <h2>Recent Links</h2>
  <table *ngIf="links.length > 0">
    <thead>
      <tr><th>Short Code</th><th>Original URL</th><th>Created</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let link of links">
        <td><a href="/{{ link.short_code }}" target="_blank">{{ link.short_code }}</a></td>
        <td class="truncate">{{ link.original_url }}</td>
        <td>{{ link.created_at | date:'short' }}</td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="links.length === 0">No links yet.</p>
</div>
